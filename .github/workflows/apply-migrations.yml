name: Apply database migrations (disabled)

# The generated bundles do not reflect current migration history. The hosted
# development database also contains separately applied and combined migrations
# with different version numbers. Neither bundle nor `supabase db push` is a
# safe replacement for a reviewed, target-specific rollout and recovery plan.
# This manual workflow intentionally cannot access secrets or connect to a DB.
on:
  workflow_dispatch:

permissions: {}

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse stale migration bundles
        run: |
          echo '::error::Migration automation is disabled: the SQL bundles and target migration history must be reconciled and independently rehearsed first.'
          echo 'See docs/PR103_SCHEMA_REHEARSAL.md and docs/CLIENT_CHANGE_PLAN.md. Do not use supabase db push as a workaround.'
          exit 1
