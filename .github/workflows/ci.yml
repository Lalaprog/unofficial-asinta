name: CI

# The test suite existed before this workflow did, which meant it protected
# nothing on push. Every check below is one that already passes locally.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Invoke the local binary directly: `npx tsc` can resolve the unrelated
      # `tsc` package from the registry and fail with a confusing message.
      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The production build succeeds without Supabase env vars, so CI does not
      # need any secrets. Runtime data access still requires them.
      - name: Build
        run: npm run build

  postgres-rehearsal:
    name: PostgreSQL 17 migration rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: asinta_test_pr103
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rehearse in an empty disposable database
        env:
          PR103_REHEARSAL_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/asinta_test_pr103
        run: npx vitest run tests/pr103-rehearsal-postgres.test.ts
      - name: Test partial export against synthetic PostgreSQL 17 data
        env:
          SUPABASE_DB_URL: postgresql://postgres@127.0.0.1:5433/asinta_test_pr103
          EXPECTED_REF: synthetic_test
        run: |
          set -euo pipefail
          python3 -c "import pathlib, re, textwrap; s=pathlib.Path('.github/workflows/backup.yml').read_text(); m=re.search(r'(?ms)^      - name: Run PostgreSQL 17 pg_dump.*?^        run: \\|\\n(.*?)(?=^      - name:)',s); assert m, 'Export step missing'; pathlib.Path('$RUNNER_TEMP/partial-export.sh').write_text(textwrap.dedent(m.group(1)))"
          cd "$RUNNER_TEMP"
          bash partial-export.sh || { echo '::error::Synthetic partial export command failed'; exit 1; }
          test "$(find backup-out -name '*.sql' | wc -l)" -eq 1 || { echo '::error::Expected one synthetic SQL export'; exit 1; }
          grep -q 'CREATE TABLE public.payroll' backup-out/*.sql || { echo '::error::Synthetic export did not contain the payroll table'; exit 1; }
          sha256sum -c backup-out/*.sha256 || { echo '::error::Synthetic export checksum failed'; exit 1; }
          rm -rf backup-out partial-export.sh
