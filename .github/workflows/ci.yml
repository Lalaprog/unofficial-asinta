          node -e "const {Client}=require('pg'); (async()=>{const c=new Client({connectionString:'postgresql://postgres@127.0.0.1:5433/asinta_test_pr103'}); await c.connect(); await c.query('CREATE DATABASE asinta_test_confirmed_rental'); await c.end()})().catch(e=>{console.error(e); process.exit(1)})"
