name: CI

# The test suite existed before this workflow did, which meant it protected
# nothing on push. Every check below is one that already passes locally.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Invoke the local binary directly: `npx tsc` can resolve the unrelated
      # `tsc` package from the registry and fail with a confusing message.
      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The production build succeeds without Supabase env vars, so CI does not
      # need any secrets. Runtime data access still requires them.
      - name: Build
        run: npm run build

  postgres-rehearsal:
    name: PostgreSQL 17 migration rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: asinta_test_pr103
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rehearse in an empty disposable database
        env:
          PR103_REHEARSAL_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/asinta_test_pr103
        run: npx vitest run tests/pr103-rehearsal-postgres.test.ts
      - name: Test draft category catalog concurrency in a separate empty database
        env:
          WORKER_CATEGORY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/asinta_test_worker_categories
        run: |
          node -e "const {Client}=require('pg'); (async()=>{const c=new Client({connectionString:'postgresql://postgres@127.0.0.1:5433/asinta_test_pr103'}); await c.connect(); await c.query('CREATE DATABASE asinta_test_worker_categories'); await c.end()})().catch(e=>{console.error(e); process.exit(1)})"
          npx vitest run tests/worker-category-catalog-postgres.test.ts
      - name: Test paid adjustment concurrency in a separate empty database
        env:
          PAID_ADJUSTMENT_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/asinta_test_paid_adjustments
        run: |
          node -e "const {Client}=require('pg'); (async()=>{const c=new Client({connectionString:'postgresql://postgres@127.0.0.1:5433/asinta_test_pr103'}); await c.connect(); await c.query('CREATE DATABASE asinta_test_paid_adjustments'); await c.end()})().catch(e=>{console.error(e); process.exit(1)})"
          npx vitest run tests/paid-payroll-adjustment-postgres.test.ts
      - name: Test draft weekly generator concurrency in a separate empty database
        env:
          WEEKLY_GENERATOR_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/asinta_test_weekly_generator
        run: |
          node -e "const {Client}=require('pg'); (async()=>{const c=new Client({connectionString:'postgresql://postgres@127.0.0.1:5433/asinta_test_pr103'}); await c.connect(); await c.query('CREATE DATABASE asinta_test_weekly_generator'); await c.end()})().catch(e=>{console.error(e); process.exit(1)})"
          npx vitest run tests/weekly-worker-generator-postgres.test.ts
      - name: Test draft weekly payment concurrency in a separate empty database
        env:
          WEEKLY_PAYMENT_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/asinta_test_weekly_payment
