name: Automated database backup

# PARTIAL database export, not a verified full-project backup. The job requires
# a configured GitHub Actions secret and has failed before dumping in this repo.
# It exports only public schema and rows, without owner or grants. app_private,
# auth, Storage objects/configuration, platform settings and other dependencies
# are excluded. A successful job or checksum does not prove restorability.
# The output contains sensitive personal and financial records: restrict GitHub
# artifact access, retention and downloads. See docs/SECURITY.md §10.
#
# STORAGE GAP (important)
# -----------------------
# Neither `pg_dump` nor a CSV table export includes receipt photos stored in the
# `receipts` Supabase Storage bucket (`expenses.receipt_url` holds only the bare
# storage path). Receipt image files must be copied separately from Supabase
# Storage (Dashboard → Storage → receipts, or the Storage API).
#
# SETUP
# -----
# Reuses the `SUPABASE_DB_URL` repository secret from `apply-migrations.yml`:
#   Repository → Settings → Secrets and variables → Actions → `SUPABASE_DB_URL`
#   (pooled connection string for project `mchkdkjntnbwrgmyobpd`).
#
# RECOVERY: a complete plan requires an isolated restore test with dependencies,
# roles/ACLs, Auth and Storage addressed separately. Row counts or checksums
# alone do not prove the project can be recovered. See docs/SECURITY.md §10.

on:
  schedule:
    # Weekly: Sunday 06:00 Asia/Manila (Saturday 22:00 UTC), after the Mon–Sat
    # site week closes.
    - cron: '0 22 * * 6'
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: 'Project ref to back up (mchkdkjntnbwrgmyobpd)'
        required: false
        type: string
        default: mchkdkjntnbwrgmyobpd
      retention_days:
        description: 'Days to retain the uploaded backup artifact in GitHub Actions (1–90)'
        required: false
        type: string
        default: '90'

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  pg-dump:
    name: pg_dump public schema
    runs-on: ubuntu-latest
    env:
      EXPECTED_REF: mchkdkjntnbwrgmyobpd
    steps:
      - name: Confirm the target project (manual runs)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
        run: |
          if [ "$CONFIRM_PROJECT_REF" != "$EXPECTED_REF" ]; then
            echo "::error::Confirmation does not match this workflow's configured project. Refusing to run."
            exit 1
          fi

      - name: Check the database URL secret is present, and that it points at this project
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set. Add the pooled connection string in Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Same ref-check guard as .github/workflows/apply-migrations.yml:
          # the ref appears in the username (postgres.<ref>) or host
          # (db.<ref>.supabase.co). Refuse to dump an unknown database.
          case "$SUPABASE_DB_URL" in
            *"$EXPECTED_REF"*) echo "URL matches $EXPECTED_REF." ;;
            *) echo "::error::SUPABASE_DB_URL does not contain $EXPECTED_REF — refusing to back up an unknown database."; exit 1 ;;
          esac

      # The connected server is PostgreSQL 17. Ubuntu 24.04's default client is
      # version 16, which cannot dump a 17 server. A newer server major needs a
      # corresponding client update; pg_dump must fail rather than emit a partial file.
      - name: Run PostgreSQL 17 pg_dump (public schema and data only)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p backup-out
          TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          DUMP_FILE="backup-out/bale-backup-${EXPECTED_REF}-${TIMESTAMP}.sql"

          # Forward the URI via environment, not the docker command line, and
          # do not print it. pg_dump expands it inside the isolated container;
          # processes with runner/container access may still see credentials.
          # This export excludes app_private, Auth, Storage, owners and ACLs.
          export PGDATABASE="$SUPABASE_DB_URL"
          docker run --rm --network host --env PGDATABASE --entrypoint sh postgres:17.6 \
            -c 'exec pg_dump --dbname="$PGDATABASE" --schema=public --clean --if-exists --no-owner --no-privileges' > "$DUMP_FILE"

          if [ ! -s "$DUMP_FILE" ]; then
            echo "::error::pg_dump produced an empty file."
            exit 1
          fi

          if ! tail -n 5 "$DUMP_FILE" | grep -q "PostgreSQL database dump complete"; then
            echo "::error::pg_dump output did not finish with 'PostgreSQL database dump complete'."
            exit 1
          fi

          sha256sum "$DUMP_FILE" > "${DUMP_FILE}.sha256"
          ls -lh backup-out/

      - name: Upload pg_dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: bale-pg-dump-${{ github.run_id }}
          path: |
            backup-out/*.sql
            backup-out/*.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 90 }}

      - name: Restore test & Storage gap reminder
        run: |
          {
            echo "### Backup artifact uploaded"
            echo ""
            echo "- **Artifact:** \`bale-pg-dump-${{ github.run_id }}\`"
            echo "- **Scope:** partial export of \`public\` schema and rows. Owners and grants are excluded."
            echo "- **Not included:** \`app_private\`, Auth, Storage files/configuration and other project settings. It is not a full project backup."
            echo "- **Sensitive:** artifact contains personal and financial data; restrict access and retention."
            echo "- **Recovery plan required:** Test restoration in an isolated equivalent environment, account for dependencies and privileges, and separately protect Auth and Storage. A checksum does not prove restorability."
          } >> "$GITHUB_STEP_SUMMARY"
